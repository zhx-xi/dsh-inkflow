name: ci

# Three triggers, each with a distinct job (do not delete one as "duplicate"):
#   pull_request → the pre-merge gate. Branch protection requires lint, both
#                  test legs, docs and package to be green on the PR head;
#                  `scripts/branch-protection-rules.mjs` (`EXPECTED`) is the one
#                  source of that list and `scripts/branch-protection.mjs check`
#                  fails when the settings drift from it.
#   push (main)  → what actually landed. A squash merge is written by GitHub, so
#                  verifying the resulting commit is not the same check as
#                  verifying the PR head.
#   merge_group  → required checks for the merge queue. GitHub only dispatches
#                  this event when the repository has a queue, so it is inert
#                  today and prevents "waiting for status to be reported" the
#                  day one is enabled.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # devDependencies only; the repo keeps `dependencies` empty. `--ignore-scripts`
      # is required because pnpm 11 refuses esbuild's postinstall by default and
      # esbuild's platform package already ships the binary.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node scripts/check-guards.mjs --no-artifacts

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
      - run: node scripts/check-docs.mjs

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node scripts/check-guards.mjs
      - run: node scripts/check-package.mjs
