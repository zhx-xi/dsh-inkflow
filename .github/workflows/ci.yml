name: ci

# Three triggers, each with a distinct job (do not delete one as "duplicate"):
#   pull_request → the pre-merge gate. Branch protection requires exactly the
#                  contexts in `scripts/branch-protection-rules.mjs`
#                  (`REQUIRED_CONTEXTS` — the one source of that list); that file
#                  also spells out the flags, and `scripts/branch-protection.mjs
#                  check` fails when the live settings drift from them.
#   push (main)  → what actually landed. A squash merge is written by GitHub, so
#                  verifying the resulting commit is not the same check as
#                  verifying the PR head.
#   merge_group  → required checks for the merge queue. GitHub only dispatches
#                  this event when the repository has a queue, so it is inert
#                  today and prevents "waiting for status to be reported" the
#                  day one is enabled.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # devDependencies only; the repo keeps `dependencies` empty. `--ignore-scripts`
      # is required because pnpm 11 refuses esbuild's postinstall by default and
      # esbuild's platform package already ships the binary.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: node scripts/check-guards.mjs --no-artifacts

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Every gate `npm run check:docs` runs must be here — that job is what branch
      # protection requires, so a step missing from this list is a gate that only runs
      # on a developer's machine. `check-module-table.mjs` was exactly that: main's
      # `check` was red for a release while CI reported green (#150/#156), because this
      # job stopped at `check-docs.mjs`. The scripts are dependency-free, so this stays a
      # plain `node` job with no install step.
      - run: node scripts/check-links.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-module-table.mjs
      - run: node scripts/check-tool-names.mjs
      # #214: every gate number a `SKILL.md` quotes must equal `gate-vocabulary.ts`'s value.
      # Same reason as the note above — a gate that only runs locally is half a gate, and the
      # skill text is precisely what the model reads instead of the code.
      - run: node scripts/check-skill-numbers.mjs
      # An issue number in source is project management, not code: it rots the moment the
      # issue closes and says nothing about why the code is shaped that way. The rule is in
      # engineering-discipline §7 and the reason belongs in words (commit / PR / thread).
      - run: node scripts/check-issue-refs.mjs

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node scripts/check-guards.mjs
      - run: node scripts/check-package.mjs
