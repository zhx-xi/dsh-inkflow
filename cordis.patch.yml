# ============================================================================
# dsh-inkflow — bundle patch
# ============================================================================
#
# Installed as a DSH bundle; this row is inserted into the Loader entry list.
# Rules that matter (verified against DSH 0.2.1-rc.2):
#
#   * A new plugin row MUST live under `- insert:`. A bare `- id: ...` row only
#     overrides an *existing* entry; when the id does not exist the patch is
#     dropped with a warning that never reaches the user.
#   * The row `id` is the Loader entry id. Keep it unique and stable: user
#     patch layers elsewhere address this row by id.
#   * `name` is the package specifier; `dsh-inkflow` resolves to this package's
#     `main` (lib/index.js).
#   * `config` below is passed verbatim to `apply(ctx, config)`.
#
# There is deliberately almost nothing to configure: a novel is a git
# repository with fixed directory names (docs/conventions.md), so a project's
# location is declared by the project itself, not by plugin config.
# ----------------------------------------------------------------------------

- insert:
    - id: dsh-inkflow
      name: 'dsh-inkflow'
      config:
        # Where this plugin keeps its own state (lastProjectRoot). NOT novel
        # data: novels live in their own git repositories.
        # Empty = "$DSH_HOME/inkflow" (~/.dsh/inkflow).
        dataDir: ''
        # Register the read-only /inkflow/api/* routes used by the workbench
        # page. They never leave this machine: the handler rejects any
        # Host/Origin that is not loopback.
        serveHttp: true
        # Writing context injected into the system prompt of sessions opened
        # inside a usable project (book/chapter/previous-tail/world-book).
        # Estimated-token budget for the whole block; when it does not fit, the
        # block is trimmed in a fixed order and says so in the text.
        promptBudgetTokens: 1200
        # Characters taken from the previous chapter's ending (the tail keeps
        # its END, not its head: the hook lives in the last sentences).
        promptTailChars: 300
